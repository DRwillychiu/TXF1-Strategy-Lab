<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <title>策略分類 × Settlement_Flat 角色決策矩陣</title>
  <desc>用「會否撐到結算 12:30」與「Alpha 來源」雙維度分類策略，並對應 Settlement_Flat 模組的角色。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    .h1 { font-size: 22px; font-weight: 700; fill: #111827; }
    .h2 { font-size: 16px; font-weight: 700; fill: #111827; }
    .h3 { font-size: 14px; font-weight: 700; fill: #111827; }
    .lbl { font-size: 13px; fill: #374151; }
    .lblB { font-size: 13px; font-weight: 700; fill: #111827; }
    .sm { font-size: 11px; fill: #4b5563; }
    .mono { font-family: Consolas, monospace; font-size: 12px; fill: #1f2937; }
    .arrow { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .sectionBg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    .yes { fill: #059669; font-weight: 700; font-size: 12px; }
    .no  { fill: #dc2626; font-weight: 700; font-size: 12px; }
    .strategy { font-family: Consolas, monospace; font-size: 12px; font-weight: 700; }
  </style>

  <text x="600" y="34" class="h1" text-anchor="middle">策略分類 × Settlement_Flat 角色 決策矩陣</text>
  <text x="600" y="56" class="sm" text-anchor="middle">用「會否撐到結算 12:30」+「Alpha 來源」雙維度分類；所有策略一律裝模組</text>

  <!-- SECTION 1: New-strategy decision tree -->
  <rect x="20" y="80" width="1160" height="540" class="sectionBg"/>
  <text x="40" y="108" class="h2">① 開發新策略的判斷流程（強制走完此圖）</text>

  <!-- Start -->
  <ellipse cx="600" cy="155" rx="180" ry="24" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
  <text x="600" y="160" class="lblB" text-anchor="middle">開發新策略 / 既有策略 input 調整</text>

  <line x1="600" y1="179" x2="600" y2="210" class="arrow" marker-end="url(#arr)"/>

  <!-- Q1: alpha source -->
  <polygon points="600,212 820,260 600,308 380,260" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="600" y="252" class="lblB" text-anchor="middle">Alpha 來源是什麼？</text>
  <text x="600" y="270" class="sm" text-anchor="middle">(趨勢延續 / 反轉 / Gap / 突破)</text>

  <line x1="380" y1="260" x2="280" y2="260" class="arrow" marker-end="url(#arr)"/>
  <text x="330" y="252" class="lbl" text-anchor="middle">反轉</text>
  <text x="330" y="266" class="lbl" text-anchor="middle">(mean rev)</text>

  <line x1="820" y1="260" x2="920" y2="260" class="arrow" marker-end="url(#arr)"/>
  <text x="870" y="252" class="lbl" text-anchor="middle">趨勢延續</text>
  <text x="870" y="266" class="lbl" text-anchor="middle">/ 突破 / Gap</text>

  <!-- Range branch -->
  <rect x="100" y="330" width="360" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="280" y="355" class="lblB" text-anchor="middle" fill="#dc2626">⚠ 盤整類策略</text>
  <text x="280" y="378" class="sm" text-anchor="middle">必須強制設計：</text>
  <text x="280" y="396" class="mono" text-anchor="middle">if Time &gt;= 1200 and MarketPosition&lt;&gt;0</text>
  <text x="280" y="414" class="mono" text-anchor="middle">  then ForceExit;</text>

  <!-- Trend branch -->
  <rect x="740" y="330" width="360" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="920" y="355" class="lblB" text-anchor="middle" fill="#059669">✓ 趨勢/突破/Gap 類策略</text>
  <text x="920" y="378" class="sm" text-anchor="middle">允許跨日，由 Settlement_Flat 接管</text>
  <text x="920" y="396" class="sm" text-anchor="middle">12:30 強制平倉 = 鎖利</text>
  <text x="920" y="414" class="sm" text-anchor="middle">L1 實證：14/0 完美勝率，貢獻 67.3% 淨利</text>

  <!-- Q2 left: did your design force exit? -->
  <line x1="280" y1="430" x2="280" y2="460" class="arrow" marker-end="url(#arr)"/>
  <polygon points="280,462 460,500 280,538 100,500" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="280" y="492" class="lblB" text-anchor="middle">回測證明 100%</text>
  <text x="280" y="510" class="lbl" text-anchor="middle">日盤 12:00 前出？</text>

  <!-- Q2 yes/no -->
  <line x1="180" y1="540" x2="180" y2="570" class="arrow" marker-end="url(#arr)"/>
  <text x="155" y="555" class="yes" text-anchor="end">YES</text>
  <rect x="20" y="570" width="300" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="170" y="595" class="lblB" text-anchor="middle" fill="#059669">✓ 安全：Intraday-Range</text>

  <line x1="380" y1="540" x2="380" y2="570" class="arrow" marker-end="url(#arr)"/>
  <text x="395" y="555" class="no">NO</text>
  <rect x="340" y="570" width="300" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="490" y="595" class="lblB" text-anchor="middle" fill="#dc2626">★ FAIL：Swing-Range = 設計禁區</text>

  <!-- Q3 right: trend, what holding pattern -->
  <line x1="920" y1="430" x2="920" y2="460" class="arrow" marker-end="url(#arr)"/>
  <polygon points="920,462 1100,500 920,538 740,500" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="920" y="495" class="lblB" text-anchor="middle">回測有任何單跨</text>
  <text x="920" y="514" class="lbl" text-anchor="middle">結算日 12:30 嗎？</text>

  <line x1="820" y1="540" x2="820" y2="570" class="arrow" marker-end="url(#arr)"/>
  <text x="795" y="555" class="no" text-anchor="end">NO</text>
  <rect x="660" y="570" width="320" height="40" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
  <text x="820" y="595" class="lblB" text-anchor="middle" fill="#4338ca">○ 兜底：Intraday/Night (0 觸發)</text>

  <line x1="1020" y1="540" x2="1020" y2="570" class="arrow" marker-end="url(#arr)"/>
  <text x="1035" y="555" class="yes">YES</text>
  <rect x="980" y="570" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="1080" y="595" class="lblB" text-anchor="middle" fill="#059669">★ Swing-Trend：核心鎖利</text>

  <!-- ============== SECTION 2: 4-quadrant matrix ============== -->
  <rect x="20" y="640" width="1160" height="490" class="sectionBg"/>
  <text x="40" y="668" class="h2">② 四象限對照（六隻策略實證落位）</text>

  <!-- axis -->
  <line x1="200" y1="710" x2="200" y2="1100" stroke="#1f2937" stroke-width="2"/>
  <line x1="200" y1="900" x2="1140" y2="900" stroke="#1f2937" stroke-width="2"/>

  <text x="135" y="730" class="lblB" text-anchor="end">Alpha</text>
  <text x="135" y="746" class="lbl" text-anchor="end">趨勢/突破</text>
  <text x="195" y="908" class="sm" text-anchor="end">|</text>
  <text x="135" y="1060" class="lblB" text-anchor="end">Alpha</text>
  <text x="135" y="1076" class="lbl" text-anchor="end">盤整反轉</text>

  <text x="450" y="1125" class="lbl" text-anchor="middle">不會撐到結算 12:30</text>
  <text x="450" y="1141" class="sm" text-anchor="middle">(回測 0 筆觸發 Settlement)</text>

  <text x="900" y="1125" class="lbl" text-anchor="middle">會撐到結算 12:30</text>
  <text x="900" y="1141" class="sm" text-anchor="middle">(回測有 Settlement 觸發)</text>

  <!-- Q1: top-left (trend + no settlement) -->
  <rect x="220" y="720" width="430" height="170" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="240" y="744" class="h3" fill="#4338ca">Q1：趨勢 × 不撐結算</text>
  <text x="240" y="764" class="sm">設計：短線趨勢 / 突破，自然日內或夜盤完成</text>
  <text x="240" y="784" class="sm">Settlement_Flat 角色：兜底保險（預期 0 觸發）</text>
  <text x="240" y="804" class="sm">實證落位：</text>
  <text x="260" y="824" class="strategy" fill="#4338ca">• L5 BreakoutLong  (突破，47% 跨日但結算 0 觸發)</text>
  <text x="260" y="842" class="strategy" fill="#4338ca">• S1 NightMomentum  (夜盤套利)</text>
  <text x="240" y="868" class="sm">部署要點：必須含 Entry gate 防結算日新單噪訊</text>

  <!-- Q2: top-right (trend + settlement) -->
  <rect x="670" y="720" width="470" height="170" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="690" y="744" class="h3" fill="#059669">Q2 ★：趨勢 × 撐結算 = 鎖利區</text>
  <text x="690" y="764" class="sm">設計：跨日波段趨勢，Settlement 12:30 鎖利</text>
  <text x="690" y="784" class="sm">Settlement_Flat 角色：核心 alpha 機制</text>
  <text x="690" y="804" class="sm">實證落位：</text>
  <text x="710" y="824" class="strategy" fill="#059669">• L1 TrendLong  (14 筆 +1,529K, 67.3% 淨利)</text>
  <text x="710" y="842" class="strategy" fill="#059669">• L2 TrendShort  (短倉，目前 0 觸發但設計類別在此)</text>
  <text x="690" y="868" class="sm">部署要點：享受結算鎖利紅利，避免 Trail/SP 干擾</text>

  <!-- Q3: bottom-left (range + no settlement) -->
  <rect x="220" y="910" width="430" height="170" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="240" y="934" class="h3" fill="#d97706">Q3：盤整 × 不撐結算 = 安全區</text>
  <text x="240" y="954" class="sm">設計：日內盤整或短 swing，有 TimeExit &lt; 12:00</text>
  <text x="240" y="974" class="sm">Settlement_Flat 角色：兜底保險（預期 0 觸發）</text>
  <text x="240" y="994" class="sm">實證落位：</text>
  <text x="260" y="1014" class="strategy" fill="#d97706">• L3 ConsolidationLong  (36% 跨日但結算 0 觸發)</text>
  <text x="260" y="1032" class="strategy" fill="#d97706">• L4 ConsolidationShort  (33% 跨日但結算 0 觸發)</text>
  <text x="240" y="1058" class="sm">部署要點：必須加強 TimeExit &lt; 12:00 機制，避免漂移到 Q4</text>

  <!-- Q4: bottom-right (range + settlement) -->
  <rect x="670" y="910" width="470" height="170" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="690" y="934" class="h3" fill="#dc2626">Q4 ★ FORBIDDEN ★：盤整 × 撐結算</text>
  <text x="690" y="954" class="sm" fill="#dc2626">設計禁區 — 不可上架，不可進入 live</text>
  <text x="690" y="974" class="sm">理由：mean rev alpha 撐到 12:30 = 反轉未發生 = 正在虧</text>
  <text x="690" y="994" class="sm">     Settlement 強制平倉 = 在反轉前砍倉 = 災難</text>
  <text x="690" y="1014" class="sm">實證落位：</text>
  <text x="710" y="1034" class="strategy" fill="#dc2626">• (無，且必須保持「無」)</text>
  <text x="690" y="1060" class="sm">policy：研究階段若出現此類，必須加 TimeExit 強制下推到 Q3</text>

  <!-- ============== SECTION 3: Rule summary ============== -->
  <rect x="20" y="1150" width="1160" height="280" class="sectionBg"/>
  <text x="40" y="1178" class="h2">③ 設計規則摘要（Constitution 條款 6-8）</text>

  <rect x="40" y="1198" width="370" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="1222" class="h3" fill="#4338ca">規則 0：一律裝模組</text>
  <text x="60" y="1244" class="sm">所有策略強制 Settlement_Flat 7 元素：</text>
  <text x="60" y="1262" class="sm">• Settlement_Flat_Time(1230) input</text>
  <text x="60" y="1278" class="sm">• v_Settlement_Day 偵測</text>
  <text x="60" y="1294" class="sm">• Entry gate 阻擋（**所有類型都需**）</text>
  <text x="60" y="1310" class="sm">• Priority 0 出場（趨勢類觸發, 其他兜底）</text>
  <text x="60" y="1340" class="sm" fill="#4338ca">為何：Entry gate 對日內策略也有價值</text>
  <text x="60" y="1356" class="sm" fill="#4338ca">（阻擋結算日 12:00 後的市場噪訊雷區）</text>
  <text x="60" y="1380" class="sm">驗證腳本：verify_settlement_flat.py</text>

  <rect x="420" y="1198" width="370" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="440" y="1222" class="h3" fill="#d97706">規則 1：三分類強制（用回測數據）</text>
  <text x="440" y="1244" class="sm">不是「日內 vs 跨日」二分法，是：</text>
  <text x="440" y="1264" class="lblB" fill="#059669">A. Swing-Trend</text>
  <text x="560" y="1264" class="sm">= 趨勢 + 撐結算</text>
  <text x="440" y="1282" class="lblB" fill="#4338ca">B. Intraday/Night</text>
  <text x="560" y="1282" class="sm">= 不撐結算</text>
  <text x="440" y="1300" class="lblB" fill="#dc2626">C. Swing-Range</text>
  <text x="560" y="1300" class="sm">= 盤整 + 撐結算 ★禁區</text>
  <text x="440" y="1326" class="sm">分類標準：跑回測，看是否有任一筆</text>
  <text x="440" y="1342" class="sm">真撐到結算日 12:30 觸發 *_Settlement</text>
  <text x="440" y="1366" class="sm">驗證腳本：</text>
  <text x="440" y="1382" class="mono">verify_strategy_holding_classification.py</text>

  <rect x="800" y="1198" width="370" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="820" y="1222" class="h3" fill="#dc2626">規則 2：禁止 Q4 + 補充規範</text>
  <text x="820" y="1244" class="sm">• Q4 (盤整 + 撐結算) 嚴禁進 live</text>
  <text x="820" y="1262" class="sm">• 盤整策略必須含 Time &gt;= 1200 強制出場</text>
  <text x="820" y="1280" class="sm">• Trail/BE 不可作為唯一日內保證</text>
  <text x="820" y="1298" class="sm">  （Trail 在收盤前未觸發 = 跨日風險）</text>
  <text x="820" y="1316" class="sm">• 手動 Roll 後必須在 MC Force Flat</text>
  <text x="820" y="1334" class="sm">  （否則 Settlement 與實際部位脫鉤）</text>
  <text x="820" y="1352" class="sm">• 每次 input 調整必須重跑分類驗證</text>
  <text x="820" y="1370" class="sm">  （防止從 Q1/Q3 漂移到 Q2/Q4）</text>
</svg>
