<meta charset="utf-8">
<title>L1_TrendLong Version Performance</title>
<style>
  :root{--bg:#12151b;--panel:#1a1e26;--line:#262c37;--txt:#c9d1de;--dim:#6b7684;
        --blue:#6fa8dc;--gold:#f0a830;--green:#5fbf8f;--red:#e0625c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.55 -apple-system,"Segoe UI","Noto Sans TC",sans-serif;padding:28px 22px 60px}
  .wrap{max-width:1500px;margin:0 auto}
  h1{font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:#e8edf5}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:26px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}
  .k{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
  .k.hot{border-color:rgba(240,168,48,.5);background:rgba(240,168,48,.07)}
  .k .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .k .old{font-size:11.5px;color:var(--dim);margin-top:5px}
  .k .new{font-size:19px;font-weight:700;margin:1px 0;
          font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  .k.hot .new{color:var(--gold)}
  .k .chg{font-size:11.5px;font-weight:600}
  .up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--dim)}
  .note{background:var(--panel);border-left:3px solid var(--gold);padding:10px 14px;
        border-radius:0 5px 5px 0;font-size:12.5px;color:#a9b4c4;margin-bottom:24px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12.5px}
  th{background:#151922;color:var(--dim);font-size:10.5px;letter-spacing:.07em;
     text-transform:uppercase;font-weight:600;padding:9px 8px;text-align:right;
     border-bottom:1px solid var(--line);white-space:nowrap}
  th:nth-child(1),th:nth-child(2){text-align:left}
  td{padding:9px 8px;border-bottom:1px solid rgba(38,44,55,.7);text-align:right;
     font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
  td:nth-child(1),td:nth-child(2){text-align:left;font-family:inherit;white-space:normal}
  td .s{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .ver{color:var(--blue);font-weight:700}
  tr.hot{background:rgba(240,168,48,.1)}
  tr.hot .ver{color:var(--gold)}
  tr.era td{background:#10141b;color:var(--dim);font-size:10.5px;letter-spacing:.13em;
            text-transform:uppercase;padding:9px 10px;text-align:left}
  tr.brk td{background:rgba(224,98,92,.07);border-top:2px solid var(--red);
            border-bottom:2px solid var(--red);text-align:left;color:#d8a09d;
            font-family:inherit;font-size:12px;padding:11px 10px;white-space:normal}
  .bar{display:inline-block;height:7px;border-radius:2px;background:#3a4150;vertical-align:middle}
  .foot{margin-top:20px;color:var(--dim);font-size:11.5px;line-height:1.75}
  .foot b{color:#a9b4c4}
</style>
<div class="wrap">
<h1>L1_TrendLong &mdash; Version Performance</h1>
<div class="sub">TXF1 &middot; 45M &middot; 2 lots &middot; slippage 1,000/side/lot &middot; capital 2,000,000 &middot; 2019-12-16 &rarr; 2026-08-22 &middot; updated 2026-08-22</div>

<div class="kpis" id="kpis"></div>
<div class="note" id="note"></div>

<table><thead><tr>
<th>版本</th><th>改了什麼</th><th>淨利</th><th>&Delta;</th><th>PF</th><th>調整PF</th>
<th>資本報酬</th><th>年化</th><th>回檔</th><th>回檔%</th><th>夏普</th><th>筆數</th>
</tr></thead><tbody id="tb"></tbody></table>

<div class="foot" id="foot"></div>
</div>

<script>
// ---- 這個陣列就是規格本身。改資料只動這裡，不動渲染邏輯。 ----
const D = [
 {era:"時代一 &mdash; 舊資料集（不可與時代二比較）"},
 {v:"V3.0",  w:"P3 三層初始停損",             sub:"ATR / 日ATR 上限",           net:null, d:null, pf:null,   apf:null,   roc:null, ann:null, dd:-547800, ddp:null, shp:null, n:null},
 {v:"V3.1",  w:"加 SL_Pct 百分比停損上限 0.5", sub:"live 現行版",                net:2145400, d:null, pf:1.359, apf:null,  roc:null, ann:null, dd:-422200, ddp:null, shp:null, n:515},
 {v:"V3.2 X4",w:"Breakout Quality Filter",   sub:"cross-TF cliff-edge",       net:null, d:null, pf:null,   apf:null,   roc:null, ann:null, dd:null,    ddp:null, shp:null, n:null, dim:true, tag:"KILLED"},

 {brk:"<b>可比性斷點 &mdash; 資料集更換 2026-08-22。</b> K棒 07-24&rarr;08-22、期間 2021-01-07&rarr;2019-12-16、資本 1M&rarr;2M、細部資料 啟用&rarr;停用。重疊筆數無法計算（母體起點不同）。<b>以下的淨利不可與以上直接相減。</b>"},

 {era:"時代二 &mdash; 新資料集"},
 {v:"v32 錨點", w:"零改動驗證 ReEntry_On=0", sub:"15,936 儲存格逐一比對，0 差異", net:5133200, d:0,      pf:1.4529, apf:1.2733, roc:256.66, ann:38.37, dd:-892000, ddp:-19.24, shp:0.2781, n:498, hot:true},
 {v:"sweep 1.0",w:"完全符合原 crossover",     sub:"零觸發",                     net:5133200, d:0,      pf:1.45,   apf:null,   roc:null,   ann:null,  dd:-892000, ddp:null,   shp:null,   n:498},
 {v:"sweep 0.7",w:"保留 70% 乖離",            sub:"",                          net:5207600, d:74400,  pf:1.46,   apf:null,   roc:null,   ann:null,  dd:-892000, ddp:null,   shp:null,   n:498},
 {v:"sweep 0.5",w:"保留 50% 乖離",            sub:"",                          net:5229600, d:22000,  pf:1.46,   apf:null,   roc:null,   ann:null,  dd:-892000, ddp:null,   shp:null,   n:500},
 {v:"sweep 0.3",w:"保留 30% 乖離",            sub:"",                          net:5348000, d:118400, pf:1.47,   apf:null,   roc:null,   ann:null,  dd:-892000, ddp:null,   shp:null,   n:500},
 {v:"sweep 0.0",w:"閘門完全關閉",              sub:"",                          net:5462400, d:114400, pf:1.48,   apf:null,   roc:null,   ann:null,  dd:-892000, ddp:null,   shp:null,   n:501},
 {v:"v32 0.2 採用",w:"二次進場上線",           sub:"Trend_Ratio sweep 7 格定案", net:5483600, d:21200,  pf:1.4863, apf:1.3033, roc:274.18, ann:40.99, dd:-892000, ddp:-19.23, shp:0.2907, n:500, hot:true}
];

const KPI = [
 {l:"淨利",      o:"5,133,200", n:"5,483,600", c:"+6.83%",  up:1, hot:1},
 {l:"獲利因子",  o:"1.4529",    n:"1.4863",    c:"+2.30%",  up:1, hot:1},
 {l:"調整PF",    o:"1.2733",    n:"1.3033",    c:"+2.36%",  up:1, hot:1},
 {l:"最大回檔",  o:"-892,000",  n:"-892,000",  c:"±0",      up:0, hot:1},
 {l:"夏普",      o:"0.2781",    n:"0.2907",    c:"+4.53%",  up:1, hot:1},
 {l:"年度夏普",  o:"0.9632",    n:"1.0070",    c:"突破 1.0", up:1, hot:1},
 {l:"索丁諾",    o:"0.7303",    n:"0.7589",    c:"+3.92%",  up:1, hot:1},
 {l:"年報酬率",  o:"38.37%",    n:"40.99%",    c:"+2.62pp", up:1, hot:1},
 {l:"毛損",      o:"-11,333,600",n:"-11,276,400",c:"虧損減少", up:1},
 {l:"月報酬標準差",o:"250,782",  n:"250,060",   c:"波動略降", up:1},
 {l:"勝率",      o:"36.35%",    n:"36.80%",    c:"+0.45pp", up:1},
 {l:"交易筆數",  o:"498",       n:"500",       c:"+2",      up:0}
];

const f = n => n === null ? "—" : n.toLocaleString("en-US");
const maxNet = Math.max(...D.filter(r=>r.net).map(r=>r.net));

document.getElementById("kpis").innerHTML = KPI.map(k =>
 `<div class="k${k.hot?" hot":""}"><div class="lbl">${k.l}</div>
  <div class="old">${k.o}</div><div class="new">${k.n}</div>
  <div class="chg ${k.up?"up":"flat"}">${k.c}</div></div>`).join("");

document.getElementById("note").innerHTML =
 "<b>怎麼讀這張表。</b> 二次進場只增加 2 筆交易，卻帶來 +350,400。真正的重點不是淨利 —— " +
 "是 <b>七格 sweep 的最大回檔完全不動，全部 &minus;892,000</b>。這代表停損繼承機制承擔了全部防禦，" +
 "增益不是靠放大風險換來的。<b>但全部貢獻集中在 2026：2020-2024 的 7 筆合計 &minus;15,600。</b>";

document.getElementById("tb").innerHTML = D.map(r => {
 if (r.era) return `<tr class="era"><td colspan="12">${r.era}</td></tr>`;
 if (r.brk) return `<tr class="brk"><td colspan="12">${r.brk}</td></tr>`;
 const w = r.net ? Math.round(96 * r.net / maxNet) : 0;
 const col = r.dim ? "#e0625c" : (r.hot ? "#f0a830" : "#3a4150");
 const bar = r.net ? `<span class="bar" style="width:${w}px;background:${col}"></span>` : "";
 const dcls = r.d === null ? "flat" : (r.d > 0 ? "up" : (r.d < 0 ? "dn" : "flat"));
 const dtxt = r.d === null ? "—" : (r.d === 0 ? "±0" : (r.d > 0 ? "+" : "") + f(r.d));
 return `<tr class="${r.hot?"hot":""}" ${r.dim?'style="opacity:.45"':""}>
  <td><span class="ver">${r.v}</span>${r.tag?`<span class="s" style="color:#e0625c">${r.tag}</span>`:""}</td>
  <td>${r.w}${r.sub?`<span class="s">${r.sub}</span>`:""}</td>
  <td>${f(r.net)} ${bar}</td>
  <td class="${dcls}">${dtxt}</td>
  <td>${r.pf===null?"—":r.pf.toFixed(4)}</td>
  <td>${r.apf===null?"—":r.apf.toFixed(4)}</td>
  <td>${r.roc===null?"—":r.roc.toFixed(2)+"%"}</td>
  <td>${r.ann===null?"—":r.ann.toFixed(2)+"%"}</td>
  <td>${f(r.dd)}</td>
  <td>${r.ddp===null?"—":r.ddp.toFixed(2)+"%"}</td>
  <td>${r.shp===null?"—":r.shp.toFixed(4)}</td>
  <td>${r.n===null?"—":r.n}</td></tr>`;
}).join("");

document.getElementById("foot").innerHTML = `
<b>表尾註記</b><br>
&bull; <b>sweep 1.0 / 0.7 / 0.5 / 0.3 / 0.0 五列只有最佳化報表欄位</b>，調整PF／資本報酬／年化／夏普／回檔% 一律填 &mdash;，不以近似值頂替。<br>
&bull; 那五列的「回檔」是最佳化報表的 <b>Max Intraday Drawdown</b>；錨點列與採用列是完整報表的 <b>最大策略虧損</b>。兩者定義不同，本表恰好同值，<b>不得因此視為同一個量</b>。<br>
&bull; &Delta; 欄相對上一列，依<b>淨利排序</b>而非 ratio 排序；斷點之後重新起算。<br>
&bull; 金色重點列 2 列（時代二起點、現行版本）。<br>
&bull; 時代一與時代二<b>夏普基準不同</b>（資本 1M vs 2M、期間不同），不得並列。<br>
&bull; <b>隨版本攜帶的保留意見：</b>① 二次進場僅 11 筆，不支撐統計宣稱；② 2026 以外為淨負；③ 規格 &sect;2.3 出場型態閘門未實作，現行為無條件武裝的超集合。<br>
&bull; <b>本版不具 PROMOTE 資格</b> &mdash; Rule #13 十維度與 Rule #18 五件套皆未跑。`;
</script>
